# ===========================================================================
#  NewsScanner — Kuwait news source registry
# ===========================================================================
#  Add / remove outlets here. Nothing else needs to change.
#
#  tier 1 = national dailies & the state wire (highest signal)
#  tier 2 = English-language dailies & digital-first outlets
#  tier 3 = niche / lifestyle / blogs
#
#  "type" is either "rss" (a real feed) or "html" (best-effort link scrape,
#  used only for outlets that publish no feed). HTML sources are marked
#  optional so a layout change degrades gracefully instead of breaking the
#  run — check `--check-sources` to see which ones are currently healthy.
# ===========================================================================

[settings]
timezone = "Asia/Kuwait"
# How far back the morning run looks. 26h gives a little overlap so nothing
# published late the previous evening is missed.
window_hours = 26
# How many of the top-ranked stories get full per-story analysis.
max_analyze = 28
# How many distinct outlets must cover a story before it is "major".
major_outlet_threshold = 3

