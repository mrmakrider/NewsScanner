# KUNA is the official state wire — every other outlet reprints it, so a
# direct pull is valuable, but it publishes no public RSS and its server
# rejects some automated requests. Kept as an optional best-effort scrape.
[[source]]
id = "kuna"
name_en = "KUNA (state wire)"
name_ar = "كونا"
homepage = "https://www.kuna.net.kw"
lang = "ar"
type = "html"
tier = 1
optional = true
pages = [
  { url = "https://www.kuna.net.kw/Default.aspx?Language=ar", section = "kuwait" },
]

# Al-Qabas dropped its public feed when it moved to a Next.js front end.
# Category pages are still server-rendered; scrape is best-effort.
[[source]]
id = "alqabas"
name_en = "Al-Qabas"
name_ar = "القبس"
homepage = "https://www.alqabas.com"
lang = "ar"
type = "html"
tier = 1
optional = true
pages = [
  { url = "https://www.alqabas.com/categories/22/", section = "local" },
  { url = "https://www.alqabas.com/categories/3/",  section = "economy" },
  { url = "https://www.alqabas.com/categories/25/", section = "security-courts" },
]
include_pattern = "alqabas\\.com/(news|article|categories)/\\d+"

