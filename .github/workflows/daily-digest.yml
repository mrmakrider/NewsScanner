name: Daily Kuwait News Brief

# Runs every morning at 08:00 Kuwait time.
# Kuwait is UTC+3 all year (no daylight saving), so 08:00 local = 05:00 UTC.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the digest but do not send email"
        type: boolean
        default: false
      no_llm:
        description: "Skip AI analysis (extractive mode only)"
        type: boolean
        default: false

# Needed so the job can commit the finished digest back to the repository.
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NewsScanner has zero third-party dependencies, so there is nothing to
      # install. This step just fails fast if the standard library changed.
      - name: Verify the code imports
        run: python -c "import news_scanner.cli, news_scanner.analyze; print('ok')"

      - name: Run the unit tests
        run: python -m unittest discover -s tests

      - name: Collect, analyse and email
        env:
          # --- AI provider: set ONE of these -----------------------------
          # The first key found is used. Gemini has the most generous free
          # tier for a daily job; any of them works.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional overrides:
          # NEWSCANNER_PROVIDER: gemini
          # NEWSCANNER_MODEL: gemini-2.5-flash
          # NEWSCANNER_LANGUAGE: bilingual

          # --- Email delivery --------------------------------------------
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m news_scanner run $ARGS

      - name: Commit the digest
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "newsscanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            # Another run may have pushed while we were working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Upload digest as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/
          retention-days: 30
          if-no-files-found: warn
