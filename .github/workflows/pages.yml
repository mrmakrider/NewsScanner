name: Pages site

# Publishes the digest archive to GitHub Pages (https://mrmakrider.github.io/NewsScanner/).
#
# The site is served from the `docs/` folder of `main` ("Deploy from a
# branch"). This workflow:
#   1. regenerates docs/ from digests/ (scripts/sync_docs.py),
#   2. commits the result back to main if anything changed,
#   3. asks GitHub Pages to rebuild, so a new edition is live within a
#      minute of being committed.
#
# NOTE: GitHub does not let a workflow's GITHUB_TOKEN *create* the Pages
# site (the endpoint needs administration:write, which Actions tokens can
# never hold — see actions/configure-pages#40). Until the one-time enable
# below has been done by the repo owner, step 3 gets a 404 and simply
# prints instructions; everything else works.
#
# ONE-TIME ENABLE (owner):  Settings → Pages → Source: "Deploy from a
# branch" → main + /docs → Save.  Or from a terminal logged in as you:
#
#   gh api -X POST repos/mrmakrider/NewsScanner/pages \
#     -f "source[branch]=main" -f "source[path]=/docs"

on:
  push:
    branches: [main]
    paths:
      - "digests/**"
      - "docs/**"
      - "scripts/sync_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write # commit regenerated docs/ back to main
  pages: write # request a Pages build via the REST API

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate docs/ from digests/
        run: python scripts/sync_docs.py

      - name: Commit regenerated docs/
        run: |
          git config user.name  "newsscanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "pages: sync $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # A push made with GITHUB_TOKEN is not guaranteed to trigger a Pages
      # build on its own, so ask for one explicitly. This is belt-and-braces
      # (branch-source sites also build on every push to main), so it is
      # best-effort by design: any outcome is logged, none fails the run.
      - name: Ask Pages to rebuild
        run: |
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/${{ github.repository }}/pages/builds')"
          body="$(tr -d '\n' < /tmp/pages.json)"
          case "$code" in
            20*)
              echo "::notice::Pages build requested (HTTP $code)."
              ;;
            404)
              echo "::notice::GitHub Pages is not enabled yet, so there is nothing to rebuild. One-time owner step: https://github.com/${{ github.repository }}/settings/pages -> Deploy from a branch -> main + /docs -> Save (or: gh api -X POST repos/${{ github.repository }}/pages -f 'source[branch]=main' -f 'source[path]=/docs')"
              ;;
            403)
              echo "::warning::Pages rebuild request not permitted (HTTP 403) — the push to main still queues a build once Pages is enabled. Response: $body"
              ;;
            *)
              echo "::warning::Pages rebuild request returned HTTP $code (ignored — builds also trigger from the push itself). Response: $body"
              ;;
          esac
          exit 0
